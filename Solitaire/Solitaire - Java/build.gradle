plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'br.com.solitaire'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.5'
    modules = ['javafx.controls']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.com.solitaire.presentation.javafx.SolitaireApplication'
}

test {
    useJUnitPlatform()
}

// Padroniza a versão do Gradle que será usada pelo projeto quando o Wrapper for gerado.
tasks.wrapper {
    gradleVersion = '9.9.1'
    distributionType = Wrapper.DistributionType.BIN
}
